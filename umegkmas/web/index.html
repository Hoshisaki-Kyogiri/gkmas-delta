<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>umegkmas 控制台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f0782d'/><path d='M9 10v8a7 7 0 0 0 14 0v-8' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round'/></svg>">
<style>
:root {
  --bg: #f6f5f3;
  --panel: #ffffff;
  --panel-2: #faf9f7;
  --line: #e7e4df;
  --text: #1f1d1a;
  --muted: #76716a;
  --accent: #f0782d;
  --accent-ink: #ffffff;
  --accent-soft: #fdeee4;
  --ok: #2f9e5b;
  --warn: #c7860a;
  --warn-soft: #fdf5e2;
  --err: #d64545;
  --err-soft: #fcecec;
  --log-bg: #1d1b19;
  --log-text: #e8e4de;
  --log-muted: #9b958c;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  --radius: 12px;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Sarasa Mono SC", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151412;
    --panel: #1e1c1a;
    --panel-2: #242220;
    --line: #34312d;
    --text: #ece8e2;
    --muted: #9d978e;
    --accent: #f5894a;
    --accent-ink: #1a1512;
    --accent-soft: #3a2619;
    --warn-soft: #3a2f16;
    --err-soft: #3b1f1f;
    --log-bg: #100f0e;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
}
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px 48px; }

/* header */
header {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
header .wrap { display: flex; align-items: center; gap: 20px; padding-top: 12px; padding-bottom: 0; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; }
.brand .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.brand b { font-size: 16px; letter-spacing: .2px; }
.brand small { color: var(--muted); }
nav { display: flex; gap: 4px; margin-left: auto; }
nav button {
  border: 0; background: none; padding: 8px 14px 12px; cursor: pointer; color: var(--muted);
  border-bottom: 2px solid transparent; font-weight: 500;
}
nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.conn { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; padding-bottom: 12px; }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.conn.off i { background: var(--err); }

main { padding-top: 24px; }
[hidden] { display: none !important; }

/* cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card + .card, .card + .banner, .banner + .card { margin-top: 16px; }
.card-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.card-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
.card-head .spacer { flex: 1; }
.card-body { padding: 18px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); }
.stat { padding: 16px 18px; border-right: 1px solid var(--line); min-width: 0; }
.stat:last-child { border-right: 0; }
.stat .label { color: var(--muted); font-size: 12px; }
.stat .value { font-size: 22px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat .value.good { color: var(--ok); }
.stat .value.hot { color: var(--accent); }
.stat .path { font-size: 13px; font-weight: 500; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 6px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
  padding: 7px 14px; cursor: pointer; white-space: nowrap; font-weight: 500;
}
.btn:hover:not(:disabled) { background: var(--panel-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.05); background: var(--accent); }
.btn.big { padding: 12px 26px; font-size: 16px; border-radius: 10px; }
.btn.danger { color: var(--err); }
.btn.link { border: 0; background: none; padding: 4px 6px; color: var(--muted); }
.btn.link:hover { color: var(--text); background: none; }

.actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.actions .hint { color: var(--muted); font-size: 13px; }
details.more { position: relative; }
details.more summary { list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more .menu {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 5; min-width: 280px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.12);
  padding: 6px;
}
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.menu button:hover { background: var(--panel-2); }
.menu button small { display: block; color: var(--muted); font-size: 12px; }

/* first run */
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.choice {
  text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px;
  padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 4px;
}
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice:disabled { opacity: .5; cursor: not-allowed; }
.choice b { font-size: 15px; }
.choice span { color: var(--muted); font-size: 13px; }
.choice.rec { border-color: var(--accent); background: var(--accent-soft); }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); margin-left: 6px; vertical-align: 2px; }

.banner { border-radius: 10px; padding: 12px 16px; border: 1px solid; }
.banner.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.banner.err { background: var(--err-soft); border-color: color-mix(in srgb, var(--err) 40%, transparent); }
.banner b { display: block; }

/* progress */
.job { display: grid; gap: 10px; }
.job-top { display: flex; align-items: baseline; gap: 12px; }
.job-top .step { font-weight: 600; font-size: 15px; }
.job-top .what { color: var(--muted); font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { height: 8px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
.bar.indeterminate > i { width: 30%; animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
.job-stats { display: flex; gap: 18px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.job-stats b { color: var(--text); font-weight: 500; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.steps span { font-size: 12px; padding: 2px 10px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.steps span.done { color: var(--ok); }
.steps span.now { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }

/* log */
.log {
  background: var(--log-bg); color: var(--log-text); font: 12.5px/1.65 var(--mono);
  height: 340px; overflow: auto; padding: 12px 16px; border-radius: 0 0 var(--radius) var(--radius);
  white-space: pre-wrap; word-break: break-all;
}
.log .l { display: block; }
.log .t { color: var(--log-muted); margin-right: 8px; }
.log .ok { color: #7fd69c; }
.log .warn { color: #f2c16b; }
.log .error { color: #ff8a80; }
.log .detail { color: #ff8a80; padding-left: 2.2em; opacity: .85; }
.log .step { color: var(--log-muted); margin: 8px 0 2px; }
.log .step::before { content: "── "; }
.log .step::after { content: " ──"; }
.log .empty { color: var(--log-muted); }

.history { list-style: none; margin: 0; padding: 0; }
.history li { display: flex; gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.history li:last-child { border-bottom: 0; }
.history .rev { font-weight: 600; min-width: 48px; }
.history .note { color: var(--muted); }
.history .when { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

/* gallery */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toolbar input[type=search], .toolbar select, .field input, .field select {
  border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 10px; min-width: 0;
}
.toolbar input[type=search] { flex: 1; min-width: 180px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 7px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.count { color: var(--muted); font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
.tile { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); cursor: zoom-in; padding: 0; text-align: left; }
.tile .img {
  aspect-ratio: 1; display: grid; place-items: center;
  background: repeating-conic-gradient(var(--panel-2) 0 25%, var(--panel) 0 50%) 0 0 / 16px 16px;
}
.tile img { max-width: 100%; max-height: 100%; object-fit: contain; }
.tile .cap { padding: 6px 8px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-top: 1px solid var(--line); }
.empty-state { text-align: center; color: var(--muted); padding: 48px 16px; }
.more-row { text-align: center; margin-top: 18px; }

dialog.viewer { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh; }
dialog.viewer::backdrop { background: rgba(0,0,0,.82); }
.viewer .frame { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.viewer img {
  max-width: 92vw; max-height: 82vh; object-fit: contain; border-radius: 6px;
  background: repeating-conic-gradient(#2a2a2a 0 25%, #333 0 50%) 0 0 / 20px 20px;
}
.viewer .meta { color: #eee; font-size: 13px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; }
.viewer .meta a, .viewer .meta button { color: #eee; }
.viewer .meta .btn { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2); }

/* settings */
.form { display: grid; gap: 16px; }
.group { display: grid; grid-template-columns: 180px 1fr; gap: 18px; padding: 18px; border-bottom: 1px solid var(--line); }
.group:last-child { border-bottom: 0; }
.group h3 { margin: 0; font-size: 14px; }
.group h3 small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; margin-top: 4px; }
.fields { display: grid; gap: 14px; }
.field { display: grid; gap: 4px; }
.field > span { font-weight: 500; }
.field > small, .check small { color: var(--muted); font-size: 12px; }
.field input[type=text], .field input[type=number], .field select { width: 100%; max-width: 440px; }
.field input.mono { font-family: var(--mono); }
.check { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; align-items: start; cursor: pointer; }
.check input { margin-top: 4px; accent-color: var(--accent); width: 16px; height: 16px; }
.check small { grid-column: 2; }
.savebar { display: flex; gap: 10px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); background: var(--panel-2); border-radius: 0 0 var(--radius) var(--radius); position: sticky; bottom: 0; }
.savebar .msg { color: var(--muted); font-size: 13px; }

/* dialog + toast */
dialog.confirm { border: 1px solid var(--line); border-radius: 14px; padding: 22px; max-width: 440px; background: var(--panel); color: var(--text); }
dialog.confirm::backdrop { background: rgba(0,0,0,.4); }
dialog.confirm h3 { margin: 0 0 8px; }
dialog.confirm p { margin: 0 0 18px; color: var(--muted); }
dialog.confirm .actions { justify-content: flex-end; }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-weight: 500;
  transition: .2s ease; pointer-events: none; z-index: 50; max-width: 90vw;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 760px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .stat:nth-child(2) { border-right: 0; }
  .stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .choices { grid-template-columns: 1fr; }
  .group { grid-template-columns: 1fr; gap: 10px; }
  nav { margin-left: 0; width: 100%; }
  .wrap { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <div class="logo"><svg width="16" height="16" viewBox="0 0 32 32"><path d="M9 10v8a7 7 0 0 0 14 0v-8" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/></svg></div>
      <div><b>umegkmas</b> <small>学园偶像大师资源更新</small></div>
    </div>
    <span class="conn" id="conn"><i></i><span>已连接</span></span>
    <nav role="tablist">
      <button role="tab" data-tab="home" aria-selected="true">控制台</button>
      <button role="tab" data-tab="gallery" aria-selected="false">图片</button>
      <button role="tab" data-tab="settings" aria-selected="false">设置</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- ================= 控制台 ================= -->
  <section id="tab-home">
    <div class="card">
      <div class="stats">
        <div class="stat">
          <div class="label">本地版本</div>
          <div class="value" id="s-local">—</div>
          <div class="sub" id="s-local-sub">&nbsp;</div>
        </div>
        <div class="stat">
          <div class="label">服务器版本</div>
          <div class="value" id="s-server">—</div>
          <div class="sub" id="s-server-sub">&nbsp;</div>
        </div>
        <div class="stat">
          <div class="label">待更新</div>
          <div class="value" id="s-pending">—</div>
          <div class="sub" id="s-pending-sub">&nbsp;</div>
        </div>
        <div class="stat">
          <div class="label">数据目录</div>
          <div class="path" id="s-dir" title="">—</div>
          <div class="sub"><button class="btn link" style="padding-left:0" data-open="data">打开文件夹 ↗</button></div>
        </div>
      </div>
    </div>

    <div class="banner warn" id="version-banner" hidden></div>
    <div class="banner err" id="server-banner" hidden></div>

    <!-- 首次运行 -->
    <div class="card" id="first-run" hidden>
      <div class="card-head"><h2>第一次运行：要下载多少？</h2></div>
      <div class="card-body">
        <div class="choices">
          <button class="choice rec" data-run="latest">
            <b>下载最新一个版本<span class="tag">推荐</span></b>
            <span>只取最近一次更新的内容，通常几十到几百 MB。之后每次只下新增的。</span>
          </button>
          <button class="choice" data-run="full" data-confirm="full">
            <b>下载整个游戏资源</b>
            <span>60 GB 以上，很慢。需要全套素材时才选。</span>
          </button>
          <button class="choice" data-run="baseline">
            <b>只记下版本号</b>
            <span>什么都不下载，从下一次游戏更新开始追。</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 常规操作 -->
    <div class="card" id="main-actions" hidden>
      <div class="card-body actions">
        <button class="btn primary big" id="btn-update" data-run="update">检查并下载更新</button>
        <button class="btn" id="btn-refresh">刷新状态</button>
        <details class="more">
          <summary class="btn">其他操作 ▾</summary>
          <div class="menu">
            <button data-run="update" data-force="1">重新处理当前版本<small>版本号没变也重新下载校验、解混淆、抽图</small></button>
            <button data-run="latest">重新下载最新一个版本<small>只取服务器最新一次更新的内容</small></button>
            <button data-run="full" data-confirm="full">下载整个游戏资源<small>60 GB 以上，很慢</small></button>
            <button data-run="baseline">只记录当前版本号<small>跳过所有待更新内容，不下载</small></button>
          </div>
        </details>
        <span class="hint" id="action-hint"></span>
      </div>
    </div>

    <!-- 任务进度 -->
    <div class="card" id="job-card" hidden>
      <div class="card-head">
        <h2 id="job-title">正在运行</h2>
        <div class="steps" id="job-steps"></div>
        <span class="spacer"></span>
        <button class="btn danger" id="btn-cancel">取消</button>
      </div>
      <div class="card-body job">
        <div class="job-top"><span class="step" id="job-step">准备中</span><span class="what" id="job-what"></span></div>
        <div class="bar indeterminate" id="job-bar"><i></i></div>
        <div class="job-stats" id="job-stats"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>日志</h2>
        <span class="spacer"></span>
        <button class="btn link" id="btn-copy-log">复制</button>
        <button class="btn link" id="btn-clear-log">清空</button>
      </div>
      <div class="log" id="log"><span class="l empty">还没有日志。点上面的按钮开始。</span></div>
    </div>

    <div class="card" id="history-card" hidden>
      <div class="card-head"><h2>最近记录</h2></div>
      <div class="card-body" style="padding-top:8px;padding-bottom:8px"><ul class="history" id="history"></ul></div>
    </div>
  </section>

  <!-- ================= 图片 ================= -->
  <section id="tab-gallery" hidden>
    <div class="card">
      <div class="card-body toolbar">
        <select id="g-rev" aria-label="版本"></select>
        <div class="seg" id="g-source">
          <button data-source="png" aria-pressed="true">PNG 原图</button>
          <button data-source="webp" aria-pressed="false">WebP 转换</button>
        </div>
        <input type="search" id="g-q" placeholder="按文件名或路径筛选，例如 costume">
        <button class="btn" id="g-open">打开文件夹 ↗</button>
      </div>
    </div>
    <div class="count" id="g-count" style="margin-top:14px"></div>
    <div class="grid" id="g-grid"></div>
    <div class="more-row"><button class="btn" id="g-more" hidden>加载更多</button></div>
  </section>

  <!-- ================= 设置 ================= -->
  <section id="tab-settings" hidden>
    <form class="card" id="cfg" autocomplete="off">
      <div class="group">
        <h3>存储<small>数据放在哪</small></h3>
        <div class="fields">
          <label class="field"><span>数据目录</span>
            <input type="text" class="mono" data-key="paths.data_dir" placeholder="留空 = 程序目录下的 data 文件夹">
            <small>全量下载需要 60 GB 以上。C 盘不够就填别的盘，例如 D:/gkmas-data</small>
          </label>
        </div>
      </div>
      <div class="group">
        <h3>下载<small>下什么、多快</small></h3>
        <div class="fields">
          <label class="check"><input type="checkbox" data-key="download.assets"><span>下载资源包</span><small>图片 / 模型 / 特效等 assetbundle</small></label>
          <label class="check"><input type="checkbox" data-key="download.resources"><span>下载资源文件</span><small>音频 / 文本等</small></label>
          <label class="check"><input type="checkbox" data-key="download.verify_md5"><span>校验已有文件的 md5</span><small>关掉会快一点，但同名更新的文件可能被漏掉</small></label>
          <label class="field"><span>同时下载连接数</span>
            <input type="number" min="1" max="64" data-key="download.workers" style="max-width:120px">
            <small>网络不好或经常失败就调小，例如 8</small>
          </label>
        </div>
      </div>
      <div class="group">
        <h3>处理<small>下载后做什么</small></h3>
        <div class="fields">
          <label class="check"><input type="checkbox" data-key="process.deobfuscate"><span>解混淆资源包</span><small>抽图的前提，一般不要关</small></label>

            <small>提示「服务器不认识游戏版本」时改这里</small>

  <div class="frame">
    <img id="v-img" alt="">

      <button class="btn" id="v-close">关闭</button>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

const MODE_LABEL = { update: "检查并下载更新", latest: "下载最新一个版本", full: "下载整个游戏资源", baseline: "只记录版本号" };
const RESULT_LABEL = { ok: "完成", failed: "部分文件失败", cancelled: "已取消", error: "出错了" };
const NOTE_LABEL = { update: "增量更新", latest: "最新一版", full: "全量", baseline: "只记录版本号" };
const STAGES = ["获取清单", "下载", "解混淆", "抽取贴图", "转换 webp", "完成"];

const state = { local: null, server: null, job: null, serverError: null };

// ---------------------------------------------------------------- helpers
async function api(path, body) {
  const opts = body === undefined ? {} : {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Umegkmas": "1" },
    body: JSON.stringify(body),
  };
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch { /* non-JSON error page */ }
  if (!res.ok) {
    const err = new Error((data && data.error) || `HTTP ${res.status}`);
    err.hint = data && data.hint;
    throw err;
  }
  return data;
}

function size(bytes) {
  if (bytes == null) return "";
  const units = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
  return `${bytes.toFixed(bytes >= 100 || i === 0 ? 0 : 1)} ${units[i]}`;
}

function duration(sec) {
  if (!isFinite(sec) || sec < 0) return "";
  sec = Math.round(sec);
  if (sec < 60) return `${sec} 秒`;
  if (sec < 3600) return `${Math.floor(sec / 60)} 分 ${sec % 60} 秒`;
  return `${Math.floor(sec / 3600)} 小时 ${Math.floor(sec % 3600 / 60)} 分`;
}

function when(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

let toastTimer;
function toast(text) {
  const el = $("#toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
}

function confirmBox(title, text, yes = "确定") {
  const dlg = $("#confirm");
  $("#confirm-title").textContent = title;
  $("#confirm-text").textContent = text;
  $("#confirm-yes").textContent = yes;
  dlg.showModal();
  return new Promise(resolve => {
    const done = ok => { dlg.close(); $("#confirm-yes").onclick = $("#confirm-no").onclick = null; resolve(ok); };
    $("#confirm-yes").onclick = () => done(true);
    $("#confirm-no").onclick = () => done(false);
    dlg.oncancel = () => done(false);
  });
}

// ---------------------------------------------------------------- tabs
function showTab(name) {
  $$("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === name));
  $$("main > section").forEach(s => s.hidden = s.id !== `tab-${name}`);
  if (name === "gallery") loadGallery();
  if (name === "settings") loadConfig();
  try { localStorage.setItem("umegkmas.tab", name); } catch { /* storage unavailable */ }
}
$$("nav button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));

// ---------------------------------------------------------------- status
async function refreshLocal() {
  const data = await api("/api/state");
  state.local = data.local;
  state.job = data.job.running;
  renderStatus();
  renderJob();
}

async function refreshServer() {
  $("#s-server").textContent = "…";
  $("#s-server-sub").textContent = "正在询问服务器";
  $("#s-pending").textContent = "…";
  try {
    state.server = await api("/api/server");
    state.serverError = null;
  } catch (err) {
    state.server = null;
    state.serverError = err;
  }
  renderStatus();
}

function renderStatus() {
  const L = state.local, S = state.server;
  if (!L) return;

  $("#s-local").textContent = L.has_baseline ? `v${L.revision}` : "未记录";
  $("#s-local").className = "value";
  $("#s-local-sub").textContent = L.has_baseline ? `更新于 ${when(L.updated_at)}` : "还没有运行过";
  $("#s-dir").textContent = L.data_dir;
  $("#s-dir").title = L.data_dir;

  if (S) {
    $("#s-server").textContent = `v${S.server_revision}`;
    $("#s-server-sub").textContent = `游戏版本 ${L.app_version}`;
    const behind = L.has_baseline && S.server_revision > L.revision;
    if (S.pending && (S.pending.bundles || S.pending.files)) {
      $("#s-pending").textContent = size(S.pending.bytes);
      $("#s-pending").className = "value hot";
      $("#s-pending-sub").textContent = `${S.pending.bundles} 个资源包 / ${S.pending.files} 个文件`;
    } else if (!L.has_baseline) {
      $("#s-pending").textContent = "—";
      $("#s-pending").className = "value";
      $("#s-pending-sub").textContent = "先选择首次下载方式";
    } else if (behind) {
      $("#s-pending").textContent = "0 B";
      $("#s-pending").className = "value";
      $("#s-pending-sub").textContent = `有新版本，但没有要下载的文件`;
    } else {
      $("#s-pending").textContent = "已是最新";
      $("#s-pending").className = "value good";
      $("#s-pending-sub").textContent = "没有新内容";
    }
  } else if (state.serverError) {
    $("#s-server").textContent = "?";
    $("#s-server-sub").textContent = "无法获取";
    $("#s-pending").textContent = "?";
    $("#s-pending").className = "value";
    $("#s-pending-sub").textContent = "";
  }

  const sb = $("#server-banner");
  if (state.serverError) {
    sb.hidden = false;
    sb.innerHTML = "";
    const b = document.createElement("b");
    b.textContent = state.serverError.message;
    sb.append(b, state.serverError.hint || "");
  } else sb.hidden = true;

  const vb = $("#version-banner");
  if (L.app_version_changed) {
    vb.hidden = false;
    vb.innerHTML = "";
    const b = document.createElement("b");
    b.textContent = `游戏版本从 ${L.state_app_version} 变成了 ${L.app_version}`;
    vb.append(b, "旧的版本号不再适用。直接点「检查并下载更新」会按全量清单处理（60 GB 以上），通常更想要的是「其他操作 → 重新下载最新一个版本」。");
  } else vb.hidden = true;

  $("#first-run").hidden = L.has_baseline;
  $("#main-actions").hidden = !L.has_baseline;

  const hint = $("#action-hint");
  if (S && S.pending && (S.pending.bundles || S.pending.files)) hint.textContent = `将下载 v${L.revision} → v${S.server_revision} 的更新`;
  else if (S && L.has_baseline && !L.app_version_changed && S.server_revision <= L.revision) hint.textContent = "已经是最新版本";
  else hint.textContent = "";

  const list = $("#history");
  list.innerHTML = "";
  for (const h of L.history || []) {
    const li = document.createElement("li");
    li.innerHTML = `<span class="rev"></span><span class="note"></span><span class="when"></span>`;
    li.children[0].textContent = `v${h.revision}`;
    li.children[1].textContent = NOTE_LABEL[h.note] || h.note;
    li.children[2].textContent = when(h.at);
    list.append(li);
  }
  $("#history-card").hidden = !(L.history && L.history.length);
  setBusy(!!state.job);
}

function setBusy(busy) {
  $$("[data-run]").forEach(b => b.disabled = busy);
  $("#btn-update").textContent = busy ? "正在运行…" : "检查并下载更新";
}

$("#btn-refresh").addEventListener("click", () => { refreshLocal(); refreshServer(); });

// ---------------------------------------------------------------- run
document.addEventListener("click", async ev => {
  const btn = ev.target.closest("[data-run]");
  if (!btn || btn.disabled) return;
  $$("details.more").forEach(d => d.open = false);
  const mode = btn.dataset.run;
  if (btn.dataset.confirm === "full" || (mode === "update" && state.local && state.local.app_version_changed)) {
    const ok = await confirmBox("下载整个游戏资源？", "需要 60 GB 以上的空间和很长时间。中途可以取消，下次会从断点继续。", "开始下载");
    if (!ok) return;
  }
  try {
    await api("/api/run", { mode, force: !!btn.dataset.force });
  } catch (err) {
    toast(err.message);
  }
});

$("#btn-cancel").addEventListener("click", async () => {
  if (!await confirmBox("取消当前任务？", "已经下载完整的文件会保留，下次运行从断点继续。", "取消任务")) return;
  $("#btn-cancel").disabled = true;
  $("#btn-cancel").textContent = "正在取消…";
  try { await api("/api/cancel", {}); } catch (err) { toast(err.message); }
});

document.addEventListener("click", async ev => {
  const btn = ev.target.closest("[data-open]");
  if (!btn) return;
  try { await api("/api/open", { target: btn.dataset.open }); } catch (err) { toast(err.message); }
});

// ---------------------------------------------------------------- job view
const job = { steps: [], samples: [], progress: null, startedAt: 0 };

function renderJob() {
  const running = !!state.job;
  $("#job-card").hidden = !running;
  setBusy(running);
  if (!running) { document.title = "umegkmas 控制台"; return; }
  $("#job-title").textContent = MODE_LABEL[state.job.mode] + (state.job.force ? "（重新处理）" : "");
  $("#btn-cancel").disabled = false;
  $("#btn-cancel").textContent = "取消";
  renderSteps();
  renderProgress();
}

function renderSteps() {
  const box = $("#job-steps");
  box.innerHTML = "";
  const current = job.steps[job.steps.length - 1];
  for (const name of STAGES) {
    if (!job.steps.includes(name) && name === "完成") continue;
    const s = document.createElement("span");
    s.textContent = name;
    if (name === current) s.className = "now";
    else if (job.steps.includes(name)) s.className = "done";
    box.append(s);
  }
  $("#job-step").textContent = current || "准备中";
}

function renderProgress() {
  const p = job.progress;
  const bar = $("#job-bar");
  const stats = $("#job-stats");
  if (!p || !p.total) {
    bar.classList.add("indeterminate");
    bar.firstElementChild.style.width = "";
    $("#job-what").textContent = p ? p.text : "";
    stats.textContent = "";
    return;
  }
  bar.classList.remove("indeterminate");
  const pct = Math.min(100, p.completed / p.total * 100);
  bar.firstElementChild.style.width = pct.toFixed(1) + "%";
  $("#job-what").textContent = p.text;

  // Rate over the last few seconds, so a stall shows up quickly.
  const now = performance.now();
  job.samples.push([now, p.completed]);
  while (job.samples.length > 2 && now - job.samples[0][0] > 4000) job.samples.shift();
  const [t0, c0] = job.samples[0];
  const rate = now - t0 > 500 ? (p.completed - c0) / ((now - t0) / 1000) : null;
  const eta = rate > 0 ? (p.total - p.completed) / rate : null;

  const parts = [`<b>${pct.toFixed(1)}%</b>`];
  if (p.unit === "bytes") {
    parts.push(`${size(p.completed)} / ${size(p.total)}`);
    if (rate != null) parts.push(`${size(rate)}/s`);
  } else {
    parts.push(`${Math.round(p.completed)} / ${p.total}`);
  }
  if (eta != null) parts.push(`剩余约 ${duration(eta)}`);
  stats.innerHTML = parts.map(x => `<span>${x}</span>`).join("");
  document.title = `${pct.toFixed(0)}% · umegkmas`;
}

// ---------------------------------------------------------------- log
const logEl = $("#log");
const MAX_LINES = 3000;
function logLine(ev) {
  const empty = $(".empty", logEl);
  if (empty) empty.remove();
  const stick = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 24;
  const line = document.createElement("span");
  line.className = "l " + (ev.kind === "step" ? "step" : ev.level || "");
  if (ev.kind !== "step" && ev.level !== "detail") {
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = new Date(ev.time * 1000).toTimeString().slice(0, 8);
    line.append(t);
  }
  const prefix = ev.level === "warn" ? "注意 " : ev.level === "error" ? "错误 " : "";
  line.append(prefix + ev.text);
  logEl.append(line);
  while (logEl.childElementCount > MAX_LINES) logEl.firstElementChild.remove();
  if (stick) logEl.scrollTop = logEl.scrollHeight;
}
$("#btn-clear-log").addEventListener("click", () => { logEl.innerHTML = '<span class="l empty">日志已清空。</span>'; });
$("#btn-copy-log").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(logEl.innerText); toast("日志已复制"); }
  catch { toast("复制失败，请手动选中复制"); }
});

// ---------------------------------------------------------------- events
let replaying = true;
function connect() {
  const es = new EventSource("/api/events");
  es.onopen = () => { $("#conn").classList.remove("off"); $("#conn span").textContent = "已连接"; };
  es.onerror = () => { $("#conn").classList.add("off"); $("#conn span").textContent = "已断开（程序窗口是否关了？）"; };
  es.onmessage = msg => {
    const ev = JSON.parse(msg.data);
    if (ev.kind === "log" || ev.kind === "step") logLine(ev);
    if (ev.kind === "step") {
      job.steps.push(ev.text);
      job.progress = null;
      job.samples = [];
      if (state.job) renderSteps(), renderProgress();
    } else if (ev.kind === "progress") {
      // The text carries a live file count, so only a new total or a counter
      // going backwards means a different bar.
      if (job.progress && (job.progress.total !== ev.total || ev.completed < job.progress.completed)) job.samples = [];
      job.progress = ev;
      if (state.job) renderProgress();
    } else if (ev.kind === "job") {
      if (ev.state === "running") {
        state.job = ev;
        job.steps = []; job.progress = null; job.samples = [];
        renderJob();
      } else {
        state.job = null;
        renderJob();
        // Replayed history also carries finished jobs; only announce live ones.
        if (Date.now() / 1000 - ev.time < 5) toast(`${MODE_LABEL[ev.mode]}：${RESULT_LABEL[ev.result] || ev.result}`);
        refreshLocal().then(refreshServer);
        galleryStale = true;
      }
    }
  };
}

// ---------------------------------------------------------------- gallery
const gal = { revisions: [], revision: 0, source: "png", q: "", offset: 0, total: 0, items: [], loading: false };
let galleryStale = true;

async function loadGallery() {
  if (!galleryStale) return;
  galleryStale = false;
  const data = await api("/api/gallery");
  gal.revisions = data.revisions;
  const sel = $("#g-rev");
  sel.innerHTML = "";
  for (const r of gal.revisions) {
    const o = document.createElement("option");
    o.value = r.revision;
    o.textContent = `v${r.revision}`;
    sel.append(o);
  }
  if (!gal.revisions.length) {
    $("#g-grid").innerHTML = "";
    $("#g-count").textContent = "";
    $("#g-grid").append(Object.assign(document.createElement("div"), {
      className: "empty-state", style: "grid-column:1/-1",
      textContent: "还没有抽出任何图片。去「控制台」运行一次更新就会出现在这里。",
    }));
    $("#g-more").hidden = true;
    return;
  }
  if (!gal.revisions.some(r => r.revision === gal.revision)) gal.revision = gal.revisions[0].revision;
  sel.value = gal.revision;
  syncSource();
  await queryImages(true);
}

function syncSource() {
  const rev = gal.revisions.find(r => r.revision === gal.revision);
  const has = rev ? rev.sources : [];
  if (!has.includes(gal.source)) gal.source = has[0] || "png";
  $$("#g-source button").forEach(b => {
    b.disabled = !has.includes(b.dataset.source);
    b.setAttribute("aria-pressed", b.dataset.source === gal.source);
  });
}

async function queryImages(reset) {
  if (gal.loading) return;
  gal.loading = true;
  if (reset) { gal.offset = 0; gal.items = []; $("#g-grid").innerHTML = ""; }
  try {
    const params = new URLSearchParams({ revision: gal.revision, source: gal.source, q: gal.q, offset: gal.offset });
    const data = await api("/api/images?" + params);
    gal.total = data.total;
    const start = gal.items.length;
    gal.items.push(...data.items);
    gal.offset = gal.items.length;
    const frag = document.createDocumentFragment();
    data.items.forEach((it, i) => {
      const tile = document.createElement("button");
      tile.className = "tile";
      tile.title = it.path;
      tile.innerHTML = `<div class="img"><img loading="lazy" alt=""></div><div class="cap"></div>`;
      $("img", tile).src = "/data/" + it.path.split("/").map(encodeURIComponent).join("/");
      $(".cap", tile).textContent = it.name;
      tile.addEventListener("click", () => openViewer(start + i));
      frag.append(tile);
    });
    $("#g-grid").append(frag);
    $("#g-count").textContent = gal.total
      ? `v${gal.revision} · 共 ${gal.total} 张${gal.q ? `（筛选：${gal.q}）` : ""}，已显示 ${gal.items.length}`
      : "没有匹配的图片。";
    $("#g-more").hidden = gal.items.length >= gal.total;
  } catch (err) {
    toast(err.message);
  } finally {
    gal.loading = false;
  }
}

$("#g-rev").addEventListener("change", e => { gal.revision = Number(e.target.value); syncSource(); queryImages(true); });
$$("#g-source button").forEach(b => b.addEventListener("click", () => {
  if (b.disabled) return;
  gal.source = b.dataset.source; syncSource(); queryImages(true);
}));
let qTimer;
$("#g-q").addEventListener("input", e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { gal.q = e.target.value.trim(); queryImages(true); }, 300);
});
$("#g-more").addEventListener("click", () => queryImages(false));
$("#g-open").addEventListener("click", async () => {
  try { await api("/api/open", { target: "images", revision: gal.revision, source: gal.source }); }
  catch (err) { toast(err.message); }
});

let viewIndex = 0;
function openViewer(i) {
  viewIndex = Math.max(0, Math.min(i, gal.items.length - 1));
  const it = gal.items[viewIndex];
  const url = "/data/" + it.path.split("/").map(encodeURIComponent).join("/");
  const img = $("#v-img");
  $("#v-size").textContent = "";
  img.onload = () => { $("#v-size").textContent = `${img.naturalWidth} × ${img.naturalHeight}`; };
  img.src = url;
  $("#v-name").textContent = it.group && it.group !== "." ? `${it.group}/${it.name}` : it.name;
  $("#v-raw").href = url;
  $("#v-prev").disabled = viewIndex === 0;
  $("#v-next").disabled = viewIndex >= gal.items.length - 1;
  const dlg = $("#viewer");
  if (!dlg.open) dlg.showModal();
}
$("#v-prev").addEventListener("click", () => openViewer(viewIndex - 1));
$("#v-next").addEventListener("click", () => openViewer(viewIndex + 1));
$("#v-close").addEventListener("click", () => $("#viewer").close());
$("#viewer").addEventListener("click", e => { if (e.target.id === "viewer") $("#viewer").close(); });
document.addEventListener("keydown", e => {
  if (!$("#viewer").open) return;
  if (e.key === "ArrowLeft") openViewer(viewIndex - 1);
  if (e.key === "ArrowRight") openViewer(viewIndex + 1);
});

// ---------------------------------------------------------------- settings
let savedConfig = null;
const cfgInputs = () => $$("#cfg [data-key]");

async function loadConfig() {
  const data = await api("/api/config");
  savedConfig = data.values;
  fillConfig(savedConfig);
  $("#cfg-msg").textContent = data.path;
}

function fillConfig(values) {
  for (const el of cfgInputs()) {
    const [sec, key] = el.dataset.key.split(".");
    const v = values[sec][key];
    if (el.type === "checkbox") el.checked = !!v;
    else el.value = v;
  }
  toggleAsp();
}

function readConfig() {
  const out = {};
  for (const el of cfgInputs()) {
    const [sec, key] = el.dataset.key.split(".");
    out[sec] = out[sec] || {};
    out[sec][key] = el.type === "checkbox" ? el.checked : el.type === "number" ? Number(el.value) : el.value.trim();
  }
  return out;
}

function toggleAsp() {
  $("#f-asp").hidden = $('[data-key="extract.backend"]').value !== "assetstudio";
}
$('[data-key="extract.backend"]').addEventListener("change", toggleAsp);
$("#cfg").addEventListener("input", () => { $("#cfg-msg").textContent = "有未保存的修改"; });
$("#cfg-reset").addEventListener("click", () => { if (savedConfig) { fillConfig(savedConfig); $("#cfg-msg").textContent = "已撤销"; } });
$("#cfg").addEventListener("submit", async e => {
  e.preventDefault();
  $("#cfg-save").disabled = true;
  try {
    const data = await api("/api/config", { values: readConfig() });
    savedConfig = data.values;
    fillConfig(savedConfig);
    $("#cfg-msg").textContent = "已保存，下次运行生效。";
    toast("配置已保存");
    galleryStale = true;
    refreshLocal().then(refreshServer);
  } catch (err) {
    $("#cfg-msg").textContent = err.message + (err.hint ? " " + err.hint : "");
  } finally {
    $("#cfg-save").disabled = false;
  }
});

// ---------------------------------------------------------------- boot
(async () => {
  let tab = "home";
  try { tab = localStorage.getItem("umegkmas.tab") || "home"; } catch { /* storage unavailable */ }
  connect();
  try {
    await refreshLocal();
  } catch (err) {
    toast(err.message);
  }
  showTab(tab);
  refreshServer();
})();
</script>
</body>
